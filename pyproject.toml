[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-mcp"
version = "0.2.0"
description = "Servidor MCP (FastMCP) que ejecuta el CLI local agy (Antigravity) con tu cuenta de Antigravity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
antigravity-mcp = "antigravity_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
