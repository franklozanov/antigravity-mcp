[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "antigravity-mcp"
version = "0.1.0"
description = "Servidor MCP (FastMCP) que conecta Claude con un API de Antigravity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
antigravity-mcp = "antigravity_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/antigravity_mcp"]
